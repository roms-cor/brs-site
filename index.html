<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Page de redirection vers la page opérateur (UTM reçues conservées, sinon ajoutées).
     GitHub Pages ne permet pas de 301 : redirection côté navigateur, repli meta refresh. -->

<link rel="icon" type="image/png" href="/assets/logos/brs-logomark-favicon.png">
<title>Redirection vers BRS Connect</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="BRS Connect">
<meta property="og:type" content="website">
<noscript><meta http-equiv="refresh" content="0;url=https://bornerecharge.fr/brs-connect/?utm_source=brsconnect.fr&amp;utm_medium=redirect&amp;utm_campaign=racine"></noscript>

<style>
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url('/assets/fonts/Inter-Variable-latin.woff2') format('woff2');}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:Inter,system-ui,sans-serif;
  background:#FFFFFF;
  color:#222222;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
}
p{font-size:1.1rem;}
a{color:inherit;}
</style>
</head>
<body>
<main>
  <p>Redirection vers <a id="cible" href="https://bornerecharge.fr/brs-connect/?utm_source=brsconnect.fr&amp;utm_medium=redirect&amp;utm_campaign=racine">bornerecharge.fr/brs-connect</a>.</p>
</main>
<script>
(function () {
  var cible = 'https://bornerecharge.fr/brs-connect/';
  var params = new URLSearchParams(window.location.search);
  var aDesUtm = false;
  params.forEach(function (valeur, cle) {
    if (cle.indexOf('utm_') === 0) { aDesUtm = true; }
  });
  if (!aDesUtm) {
    params.set('utm_source', 'brsconnect.fr');
    params.set('utm_medium', 'redirect');
    params.set('utm_campaign', 'racine');
  }
  var url = cible + '?' + params.toString() + window.location.hash;
  var lien = document.getElementById('cible');
  if (lien) { lien.href = url; }
  window.location.replace(url);
})();
</script>
</body>
</html>
