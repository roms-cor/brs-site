<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ============================================================
     PAGE DE REDIRECTION — écrite à la main le 2026-10-15
     (remplace la page « Page inaccessible » du 2026-08-24).
     La racine renvoie vers la page opérateur. Le build ne touche
     jamais à ce fichier tant que PREVIEW = true (build/config.mjs).
     Le site complet reste consultable sur /home/ (noindex).
     UTM : celles reçues sont conservées telles quelles ; sans UTM,
     on ajoute utm_source=brsconnect.fr, utm_medium=redirect,
     utm_campaign=racine. GitHub Pages ne permet pas de 301 :
     redirection côté navigateur (script, repli meta refresh).
     Pour remettre le site complet en ligne : PREVIEW = false dans
     build/config.mjs, `npm run build`, puis commit + push.
     ============================================================ -->

<title>Redirection vers BRS Connect</title>
<meta name="robots" content="noindex">
<noscript><meta http-equiv="refresh" content="0;url=https://bornerecharge.fr/brs-connect/?utm_source=brsconnect.fr&amp;utm_medium=redirect&amp;utm_campaign=racine"></noscript>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:#FFFFFF;
  color:#222222;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
}
p{font-size:1.1rem;}
a{color:inherit;}
</style>
</head>
<body>
<main>
  <p>Redirection vers <a id="cible" href="https://bornerecharge.fr/brs-connect/?utm_source=brsconnect.fr&amp;utm_medium=redirect&amp;utm_campaign=racine">bornerecharge.fr/brs-connect</a>.</p>
</main>
<script>
(function () {
  var cible = 'https://bornerecharge.fr/brs-connect/';
  var params = new URLSearchParams(window.location.search);
  var aDesUtm = false;
  params.forEach(function (valeur, cle) {
    if (cle.indexOf('utm_') === 0) { aDesUtm = true; }
  });
  if (!aDesUtm) {
    params.set('utm_source', 'brsconnect.fr');
    params.set('utm_medium', 'redirect');
    params.set('utm_campaign', 'racine');
  }
  var url = cible + '?' + params.toString() + window.location.hash;
  var lien = document.getElementById('cible');
  if (lien) { lien.href = url; }
  window.location.replace(url);
})();
</script>
</body>
</html>
